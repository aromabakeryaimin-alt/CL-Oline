<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦連線 · 相片交換</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f6fed;--ok:#1a9a5b;--bd:#dde2ec;--dg:#d93b3b}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mut:#8f98ad;--ac:#5b8cff;--ok:#3ccf8a;--bd:#2c3340;--dg:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);padding:24px}
.wrap{max-width:820px;margin:auto}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.code{font:700 40px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--ac)}
label{color:var(--mut);font-size:13px;display:block;margin-bottom:6px}
input[type=text]{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;width:150px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);text-align:center}
button{font-size:15px;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.st{font-size:14px;color:var(--mut)}.st.ok{color:var(--ok);font-weight:600}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.zones{grid-template-columns:1fr}}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:24px 12px;text-align:center;color:var(--mut);cursor:pointer}
.drop b{display:block;color:var(--tx);margin-bottom:4px}
.drop.on{border-color:var(--ac);color:var(--ac)}
.drop.off{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.it{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg)}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.it .tag{position:absolute;top:6px;left:6px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
.acts{display:flex;border-top:1px solid var(--bd)}
.acts a,.acts button{flex:1;text-align:center;font-size:12px;padding:7px 2px;color:var(--ac);text-decoration:none;background:none;border:0;border-radius:0;cursor:pointer}
.acts button.del{color:var(--dg)}
.acts>*+*{border-left:1px solid var(--bd)}
h2{font-size:16px;margin:0 0 4px}
.badge{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:1px 9px;color:var(--mut);margin-left:6px}
#scan{display:none;margin-top:14px}#scan video{width:100%;max-width:360px;border-radius:12px;background:#000;display:block}
#qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0;min-height:40px}
#qrBox{margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 電腦連線 · 相片交換</h1>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><label>本機編號(把這個告訴對方)</label><div class="code" id="myId">····</div></div>
      <div>
        <label>輸入對方編號</label>
        <div class="row">
          <input id="target" type="text" maxlength="4" placeholder="A1B2" autocomplete="off">
          <button id="go">連線</button>
          <button id="scanBtn" class="alt">📷 掃描</button>
          <button id="leave" class="alt" style="display:none;color:var(--dg);border-color:var(--dg)">離開連線</button>
        </div>
      </div>
    </div>
    <p class="st" id="st" style="margin:14px 0 0">正在取得編號…</p>
    <div id="scan">
      <video id="vid" playsinline muted></video>
      <canvas id="cv" hidden></canvas>
      <p class="st" style="margin:8px 0 0">請將對方的二維碼對準鏡頭 <button id="scanStop" class="alt" style="padding:4px 12px;font-size:13px">關閉</button></p>
    </div>
    <div id="qrBox" class="row" style="align-items:flex-start;gap:16px">
      <div id="qr"></div>
      <div style="flex:1;min-width:200px">
        <h2>📱 手機掃描連線</h2>
        <p class="st" style="margin:0">用手機相機掃描,即可開啟本頁並自動連到這部電腦。</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>傳送相片</h2>
    <p class="st" style="margin:0 0 12px">連線後,點擊或拖放相片到對應的區域,即可傳給對方。</p>
    <div class="zones">
      <div class="drop off" data-cat="work"><b>🛠 工作照片</b>點擊選擇,或拖放到這裡</div>
      <div class="drop off" data-cat="done"><b>✅ 已完成照片</b>點擊選擇,或拖放到這裡</div>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2>🛠 工作照片<span class="badge" id="nWork">0</span></h2>
    <div class="grid" id="gridWork"></div>
    <p class="st" id="emptyWork">還沒有工作照片</p>
  </div>

  <div class="card">
    <h2>✅ 已完成照片<span class="badge" id="nDone">0</span></h2>
    <div class="grid" id="gridDone"></div>
    <p class="st" id="emptyDone">還沒有已完成照片</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const PREFIX='pclink-', CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const $=id=>document.getElementById(id);
const SITE='https://aromabakeryaimin-air.github.io/CL-Oline/';
const CATS={work:'工作',done:'已完成'};
let peer, conn, autoDone=false, stream, scanning=false, pickCat='work', ID, lastRx=0, restartT;
const items=new Map(); // id -> {id,blob,name,cat,tag,t,url}

// ---- 本地保存 (IndexedDB) ----
let db;
const dbReady=new Promise(res=>{
  try{
    const r=indexedDB.open('photoswap',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});
    r.onsuccess=()=>{db=r.result;res()};
    r.onerror=()=>res();
  }catch(_){res()}
});
const dbPut=it=>{
  if(!db)return;
  try{db.transaction('p','readwrite').objectStore('p').put({id:it.id,blob:it.blob,name:it.name,cat:it.cat,tag:it.tag,t:it.t})}catch(_){}
};
const dbDel=id=>{if(!db)return;try{db.transaction('p','readwrite').objectStore('p').delete(id)}catch(_){}};
async function dbLoad(){
  await dbReady;if(!db)return;
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  const r=db.transaction('p').objectStore('p').getAll();
  r.onsuccess=()=>{
    r.result.sort((a,b)=>a.t-b.t).forEach(o=>{
      if(!items.has(o.id))items.set(o.id,{...o,url:URL.createObjectURL(o.blob)});
    });
    render();
  };
}

const rid=()=>Array.from({length:4},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const say=(t,ok)=>{$('st').textContent=t;$('st').className='st'+(ok?' ok':'')};
const live=()=>conn&&conn.open;
const tell=m=>{if(live())try{conn.send(m)}catch(_){}};

const LS={
  get:k=>{try{return localStorage.getItem(k)||''}catch(_){return ''}},
  set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(_){}}
};
const getId=()=>{let id=LS.get('pc_id');if(!/^[A-Z0-9]{4}$/.test(id)){id=rid();LS.set('pc_id',id)}return id};
const saved=()=>LS.get('pc_peer');
const updateLeave=()=>{$('leave').style.display=saved()?'':'none'};

function start(){
  ID=ID||getId();               // 專屬編號:存在本機,永不更換
  const old=peer;peer=null;
  try{old&&old.destroy()}catch(_){}
  const p=peer=new Peer(PREFIX+ID);
  p.on('open',()=>{
    $('myId').textContent=ID;
    if(!live())say('等待連線中… 或輸入對方編號後按「連線」');
    drawQR();updateLeave();
    const c=new URLSearchParams(location.search).get('c');
    if(c&&/^[A-Za-z0-9]{4}$/.test(c)&&!autoDone){autoDone=true;$('target').value=c.toUpperCase();$('go').click()}
    else dial();
  });
  p.on('connection',c=>setup(c));
  p.on('error',e=>{
    if(e.type==='unavailable-id'){
      say('編號 '+ID+' 暫時被佔用(舊連線尚未釋放,或已在別的視窗開啟),自動重試中…');
      restart(3000);return;
    }
    if(e.type==='peer-unavailable'){say(saved()?'等待對方上線… 自動重試中':'找不到該編號,請確認對方已開啟此頁面');return}
    say('網路錯誤:'+e.type+',自動重試中…');
    if(['network','server-error','socket-error','socket-closed'].includes(e.type))restart(3000);
  });
  p.on('disconnected',()=>{setTimeout(()=>{try{if(p===peer&&!p.destroyed)p.reconnect()}catch(_){}},1500)});
  p.on('close',()=>{if(p===peer)restart(3000)});
}
function restart(ms){clearTimeout(restartT);restartT=setTimeout(start,ms)}

// 以「編號較小」的一方負責主動撥號,避免雙方同時連線互相衝突
function dial(){
  const s=saved();
  if(!s||live()||!peer||!peer.open)return;
  if(ID>s){say('等待 '+s+' 重新連線…');return}
  if(conn&&Date.now()-conn._t<10000)return; // 上一次嘗試還在進行
  say('正在重新連線到 '+s+'…');
  setup(peer.connect(PREFIX+s,{reliable:true}));
}

function setZones(on){document.querySelectorAll('.drop').forEach(z=>z.classList.toggle('off',!on))}

function setup(c){
  if(live()&&conn!==c){c.close();return}
  if(conn&&conn!==c){const o=conn;conn=null;try{o.close()}catch(_){}}
  conn=c;c._t=Date.now();
  c.on('open',()=>{
    const who=c.peer.replace(PREFIX,'');
    LS.set('pc_peer',who);updateLeave();lastRx=Date.now();
    say('✅ 已連線到 '+who,true);
    setZones(true);
  });
  c.on('data',d=>{
    lastRx=Date.now();
    if(!d)return;
    if(d.type==='photo')add(d.id,new Blob([d.data],{type:d.mime}),d.name,d.cat==='done'?'done':'work','收到');
    else if(d.type==='del')remove(d.id);
    else if(d.type==='move')move(d.id,d.cat);
    else if(d.type==='bye')theyLeft();
  });
  c.on('close',()=>{
    if(conn!==c)return;
    conn=null;setZones(false);
    say(saved()?'連線中斷,自動重新連線中…(相片仍保留在本頁)':'連線已中斷');
    setTimeout(dial,1500);
  });
  c.on('error',e=>{if(conn===c)say('連線錯誤:'+e.type)});
}

function theyLeft(){
  LS.set('pc_peer','');updateLeave();
  const c=conn;conn=null;try{c&&c.close()}catch(_){}
  setZones(false);say('對方已離開連線');
}

$('leave').onclick=()=>{
  if(!confirm('確定離開連線?\n離開後不會自動重連,需重新輸入編號。'))return;
  tell({type:'bye'});
  LS.set('pc_peer','');updateLeave();
  const c=conn;conn=null;setZones(false);
  setTimeout(()=>{try{c&&c.close()}catch(_){}},300);
  say('已離開連線');
};

$('go').onclick=()=>{
  const t=$('target').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(t)){say('編號必須是 4 個英文字母或數字');return}
  if(t===ID){say('不能連線到自己');return}
  if(live()){say('已連線,若要換對象請先按「離開連線」');return}
  if(!peer||!peer.open){say('尚未取得編號,請稍候');return}
  say('連線中…');
  setup(peer.connect(PREFIX+t,{reliable:true}));
};
$('target').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

// 自動重連 + 心跳(保持連線不被斷開)
setInterval(dial,3000);
setInterval(()=>{
  if(!live())return;
  tell({type:'ping'});
  if(Date.now()-lastRx>35000){try{conn.close()}catch(_){}}
},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dial()});
window.addEventListener('online',()=>{try{if(peer&&peer.disconnected)peer.reconnect()}catch(_){}dial()});

async function send(files,cat){
  if(!live()){say('尚未連線');return}
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    try{
      const id=uid();
      conn.send({type:'photo',id,cat,name:f.name,mime:f.type,data:await f.arrayBuffer()});
      add(id,f,f.name,cat,'已傳');
    }catch(e){say('傳送失敗:'+f.name)}
  }
}

function add(id,blob,name,cat,tag){
  if(items.has(id))return;
  const it={id,blob,name,cat,tag,t:Date.now(),url:URL.createObjectURL(blob)};
  items.set(id,it);dbPut(it);
  render();
}
function remove(id){
  const it=items.get(id);if(!it)return;
  URL.revokeObjectURL(it.url);items.delete(id);dbDel(id);render();
}
function move(id,cat){
  const it=items.get(id);if(!it||!CATS[cat])return;
  it.cat=cat;dbPut(it);render();
}

function render(){
  const g={work:$('gridWork'),done:$('gridDone')},n={work:0,done:0};
  g.work.innerHTML='';g.done.innerHTML='';
  [...items.values()].reverse().forEach(it=>{
    n[it.cat]++;
    const other=it.cat==='work'?'done':'work';
    const d=document.createElement('div');d.className='it';
    d.innerHTML='<img alt=""><span class="tag"></span><div class="acts"><a download>下載</a><button class="mv"></button><button class="del">刪除</button></div>';
    d.querySelector('img').src=it.url;
    d.querySelector('.tag').textContent=it.tag;
    const a=d.querySelector('a');a.href=it.url;a.download=it.name;
    const mv=d.querySelector('.mv');
    mv.textContent=it.cat==='work'?'→完成':'←工作';
    mv.onclick=()=>{move(it.id,other);tell({type:'move',id:it.id,cat:other})};
    d.querySelector('.del').onclick=()=>{
      if(!confirm('確定刪除這張相片?\n(若已連線,對方那邊也會一併刪除)'))return;
      remove(it.id);tell({type:'del',id:it.id});
    };
    g[it.cat].appendChild(d);
  });
  $('nWork').textContent=n.work;$('nDone').textContent=n.done;
  $('emptyWork').style.display=n.work?'none':'';
  $('emptyDone').style.display=n.done?'none':'';
}

document.querySelectorAll('.drop').forEach(z=>{
  const cat=z.dataset.cat;
  z.onclick=()=>{pickCat=cat;$('file').click()};
  z.ondragover=e=>{e.preventDefault();z.classList.add('on')};
  z.ondragleave=()=>z.classList.remove('on');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('on');send(e.dataTransfer.files,cat)};
});
$('file').onchange=e=>{send([...e.target.files],pickCat);e.target.value=''};

function drawQR(){
  const code=$('myId').textContent;
  const base=location.protocol.startsWith('http')?location.origin+location.pathname:SITE;
  const box=$('qr');box.innerHTML='';
  new QRCode(box,{text:base+'?c='+code,width:140,height:140,correctLevel:QRCode.CorrectLevel.M});
}

function parseCode(t){
  t=(t||'').trim();
  if(/^[A-Za-z0-9]{4}$/.test(t))return t.toUpperCase();
  try{const c=new URL(t).searchParams.get('c');if(c&&/^[A-Za-z0-9]{4}$/.test(c))return c.toUpperCase()}catch(_){}
  return null;
}
function stopScan(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('scan').style.display='none';
}
async function startScan(){
  if(scanning)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('此瀏覽器不支援相機(需使用 https 網址)');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){say('無法開啟相機,請允許相機權限');return}
  const v=$('vid');v.srcObject=stream;await v.play();
  $('scan').style.display='block';scanning=true;
  const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!scanning)return;
    if(v.readyState===v.HAVE_ENOUGH_DATA&&v.videoWidth){
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      ctx.drawImage(v,0,0);
      const img=ctx.getImageData(0,0,cv.width,cv.height);
      const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      const code=r&&parseCode(r.data);
      if(code){stopScan();$('target').value=code;$('go').click();return}
    }
    requestAnimationFrame(tick);
  };
  tick();
}
$('scanBtn').onclick=startScan;
$('scanStop').onclick=stopScan;

dbLoad();
start();
</script>
</body>
</html>
