<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦連線 · 相片交換</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f6fed;--ok:#1a9a5b;--bd:#dde2ec}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mut:#8f98ad;--ac:#5b8cff;--ok:#3ccf8a;--bd:#2c3340}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);padding:24px}
.wrap{max-width:760px;margin:auto}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.code{font:700 40px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--ac)}
label{color:var(--mut);font-size:13px;display:block;margin-bottom:6px}
input[type=text]{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;width:150px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);text-align:center}
button{font-size:15px;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.st{font-size:14px;color:var(--mut)}.st.ok{color:var(--ok);font-weight:600}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}
#drop.on{border-color:var(--ac);color:var(--ac)}
#drop.off{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.it{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg)}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.it span{position:absolute;top:6px;left:6px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
.it a{display:block;text-align:center;font-size:12px;padding:6px;color:var(--ac);text-decoration:none}
h2{font-size:16px;margin:0 0 4px}
#scan{display:none;margin-top:14px}#scan video{width:100%;max-width:360px;border-radius:12px;background:#000;display:block}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0;min-height:40px}
#qrBox{margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
#base{width:100%;max-width:340px;font:14px system-ui,sans-serif;letter-spacing:0;text-transform:none;padding:8px 10px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 電腦連線 · 相片交換</h1>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><label>本機編號(把這個告訴對方)</label><div class="code" id="myId">····</div></div>
      <div>
        <label>輸入對方編號</label>
        <div class="row">
          <input id="target" type="text" maxlength="4" placeholder="A1B2" autocomplete="off">
          <button id="go">連線</button>
          <button id="scanBtn" class="alt">📷 掃描</button>
        </div>
      </div>
    </div>
    <p class="st" id="st" style="margin:14px 0 0">正在取得編號…</p>
    <div id="scan">
      <video id="vid" playsinline muted></video>
      <canvas id="cv" hidden></canvas>
      <p class="st" style="margin:8px 0 0">請將對方的二維碼對準鏡頭 <button id="scanStop" class="alt" style="padding:4px 12px;font-size:13px">關閉</button></p>
    </div>
    <div id="qrBox" class="row" style="align-items:flex-start;gap:16px">
      <div id="qr"></div>
      <div style="flex:1;min-width:200px">
        <h2>📱 手機掃描連線</h2>
        <p class="st" style="margin:0 0 8px">用手機相機掃描,即可開啟本頁並自動連到這部電腦。</p>
        <div id="baseWrap" style="display:none !important">
          <label>你正在用本機檔案開啟,請貼上此頁的網上網址(https://…),手機才能打開:</label>
          <input id="base" type="text" placeholder="https://your-site.netlify.app/">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>傳送相片</h2>
    <p class="st" style="margin:0 0 12px">連線後,點擊或拖放相片即可傳給對方。</p>
    <div id="drop" class="off">📷 點擊選擇相片,或拖放到這裡</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2>相片</h2>
    <div class="grid" id="grid"></div>
    <p class="st" id="empty">還沒有相片</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const PREFIX='pclink-', CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const $=id=>document.getElementById(id);
const SITE='https://aromabakeryaimin-air.github.io/CL-Oline/';
let peer, conn, autoDone=false, stream, scanning=false;

const rid=()=>Array.from({length:4},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
const say=(t,ok)=>{$('st').textContent=t;$('st').className='st'+(ok?' ok':'')};

function start(){
  const id=rid();
  peer=new Peer(PREFIX+id);
  peer.on('open',()=>{
    $('myId').textContent=id;say('等待連線中… 或輸入對方編號後按「連線」');
    drawQR();
    const c=new URLSearchParams(location.search).get('c');
    if(c&&/^[A-Za-z0-9]{4}$/.test(c)&&!autoDone){autoDone=true;$('target').value=c.toUpperCase();$('go').click()}
  });
  peer.on('connection',c=>setup(c));
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();start();return}
    if(e.type==='peer-unavailable')say('找不到該編號,請確認對方已開啟此頁面');
    else say('錯誤:'+e.type);
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
}

function setup(c){
  if(conn&&conn.open){c.close();return}
  conn=c;
  c.on('open',()=>{
    const who=c.peer.replace(PREFIX,'');
    say('✅ 已連線到 '+who,true);
    $('drop').classList.remove('off');
  });
  c.on('data',d=>{
    if(d&&d.type==='photo')add(new Blob([d.data],{type:d.mime}),d.name,'收到');
  });
  c.on('close',()=>{say('連線已中斷');$('drop').classList.add('off');conn=null});
  c.on('error',e=>say('連線錯誤:'+e.type));
}

$('go').onclick=()=>{
  const t=$('target').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(t)){say('編號必須是 4 個英文字母或數字');return}
  if(t===$('myId').textContent){say('不能連線到自己');return}
  say('連線中…');
  setup(peer.connect(PREFIX+t,{reliable:true}));
};
$('target').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

async function send(files){
  if(!conn||!conn.open)return;
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    conn.send({type:'photo',name:f.name,mime:f.type,data:await f.arrayBuffer()});
    add(f,f.name,'已傳');
  }
}

function add(blob,name,tag){
  const url=URL.createObjectURL(blob);
  const d=document.createElement('div');d.className='it';
  d.innerHTML='<img alt=""><span></span><a download>下載</a>';
  d.querySelector('img').src=url;
  d.querySelector('span').textContent=tag;
  const a=d.querySelector('a');a.href=url;a.download=name;
  $('grid').prepend(d);$('empty').style.display='none';
}

const dz=$('drop');
dz.onclick=()=>$('file').click();
$('file').onchange=e=>{send(e.target.files);e.target.value=''};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');send(e.dataTransfer.files)};

function drawQR(){
  const code=$('myId').textContent;
  const base=location.protocol.startsWith('http')?location.origin+location.pathname:SITE;
  const box=$('qr');box.innerHTML='';
  if(!base){box.style.lineHeight='1.4';box.style.color='#888';box.style.fontSize='12px';box.textContent='貼上網址後顯示';return}
  box.style.cssText='';
  new QRCode(box,{text:base+'?c='+code,width:140,height:140,correctLevel:QRCode.CorrectLevel.M});
}

function parseCode(t){
  t=(t||'').trim();
  if(/^[A-Za-z0-9]{4}$/.test(t))return t.toUpperCase();
  try{const c=new URL(t).searchParams.get('c');if(c&&/^[A-Za-z0-9]{4}$/.test(c))return c.toUpperCase()}catch(_){}
  return null;
}
function stopScan(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('scan').style.display='none';
}
async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('此瀏覽器不支援相機(需使用 https 網址)');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){say('無法開啟相機,請允許相機權限');return}
  const v=$('vid');v.srcObject=stream;await v.play();
  $('scan').style.display='block';scanning=true;
  const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!scanning)return;
    if(v.readyState===v.HAVE_ENOUGH_DATA&&v.videoWidth){
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      ctx.drawImage(v,0,0);
      const img=ctx.getImageData(0,0,cv.width,cv.height);
      const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(r){
        const code=parseCode(r.data);
        if(code){stopScan();$('target').value=code;$('go').click();return}
      }
    }
    requestAnimationFrame(tick);
  };
  tick();
}
$('scanBtn').onclick=startScan;
$('scanStop').onclick=stopScan;

start();
</script>
</body>
</html>
